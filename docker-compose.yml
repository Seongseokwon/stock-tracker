services:
  postgres:
    image: postgres:16-alpine
    container_name: stockpulse-db
    environment:
      POSTGRES_DB: stockpulse
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - stockpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d stockpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stockpulse_pgdata:
