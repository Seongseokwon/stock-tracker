<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>로그인 — StockPulse</title>
  <meta name="theme-color" content="#080c14" />
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      var t = localStorage.getItem('sp_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
    // 이미 로그인 상태면 대시보드로 리다이렉트
    (async function () {
      try {
        var r = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (r.ok) {
          var d = await r.json();
          if (d.loggedIn) window.location.replace('/');
        }
      } catch (_) { /* 네트워크 오류 무시 — 로그인 폼 표시 */ }
    })();
  </script>
</head>
<body class="login-page">

  <!-- ── 로그인 카드 ── -->
  <main class="login-main">
    <div class="login-card">

      <!-- 로고 -->
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <polyline points="22,7 13.5,15.5 8.5,10.5 2,17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="16,7 22,7 22,13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="login-logo-text">StockPulse</span>
      </div>

      <!-- 제목 -->
      <div class="login-header">
        <h1 class="login-title">1회용 코드로 로그인</h1>
        <p class="login-subtitle">관리자로부터 받은 코드를 입력하세요</p>
      </div>

      <!-- 폼 -->
      <form class="login-form" id="loginForm" autocomplete="off">
        <div class="login-input-wrap">
          <input
            id="codeInput"
            type="text"
            class="login-code-input"
            placeholder="XXXXXXXX"
            maxlength="16"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="characters"
            aria-label="1회용 로그인 코드"
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span id="loginBtnText">로그인</span>
          <svg id="loginBtnSpinner" class="login-spinner hidden" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" stroke-dasharray="32" stroke-dashoffset="12" stroke-linecap="round"/>
          </svg>
        </button>

        <p id="loginError" class="login-error hidden">코드가 올바르지 않습니다. 다시 확인해주세요.</p>
      </form>

      <!-- 안내 -->
      <p class="login-hint">
        코드가 없으신가요?
        <button type="button" class="login-hint-link" id="openRequestBtn">아래 버튼으로 요청</button>하세요.
      </p>

    </div>
  </main>

  <!-- ── 코드 요청 FAB (우측 하단) ── -->
  <div class="request-fab-wrap" id="requestFabWrap">

    <!-- 팝업 패널 -->
    <div class="request-panel" id="requestPanel" aria-hidden="true">
      <p class="request-panel-title">접속 코드 요청</p>
      <p class="request-panel-desc">관리자에게 1회용 로그인 코드를 요청합니다.</p>
      <div class="request-panel-actions">
        <a
          class="request-action-btn"
          id="emailRequestBtn"
          href="mailto:devswseong@gmail.com?subject=StockPulse%20%EC%A0%91%EC%86%8D%20%EC%BD%94%EB%93%9C%20%EC%9A%94%EC%B2%AD&body=%EC%95%88%EB%85%95%ED%95%98%EC%84%B8%EC%9A%94%2C%20StockPulse%20%EC%A0%91%EC%86%8D%20%EC%BD%94%EB%93%9C%EB%A5%BC%20%EC%9A%94%EC%B2%AD%ED%95%A9%EB%8B%88%EB%8B%A4."
          target="_blank"
          rel="noopener"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
            <polyline points="2,4 12,13 22,4" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          이메일로 요청
        </a>
        <a
          class="request-action-btn"
          id="slackRequestBtn"
          href="https://slack.com/app_redirect?channel=stockpulse-access"
          target="_blank"
          rel="noopener"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z" fill="currentColor"/>
            <path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" fill="currentColor"/>
            <path d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z" fill="currentColor"/>
            <path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z" fill="currentColor"/>
            <path d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-5c-.83 0-1.5-.67-1.5-1.5z" fill="currentColor"/>
            <path d="M15.5 19H14v1.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5z" fill="currentColor"/>
            <path d="M10 9.5C10 8.67 9.33 8 8.5 8h-5C2.67 8 2 8.67 2 9.5S2.67 11 3.5 11h5c.83 0 1.5-.67 1.5-1.5z" fill="currentColor"/>
            <path d="M8.5 5H10V3.5C10 2.67 9.33 2 8.5 2S7 2.67 7 3.5 7.67 5 8.5 5z" fill="currentColor"/>
          </svg>
          Slack으로 요청
        </a>
      </div>
    </div>

    <!-- FAB 버튼 -->
    <button type="button" class="request-fab" id="requestFab" aria-label="코드 요청" aria-expanded="false">
      <svg class="fab-icon-msg" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="fab-icon-close hidden" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>

  </div>

  <script>
    /* ── FAB 토글 ── */
    const fab       = document.getElementById('requestFab');
    const panel     = document.getElementById('requestPanel');
    const iconMsg   = fab.querySelector('.fab-icon-msg');
    const iconClose = fab.querySelector('.fab-icon-close');
    const openBtn   = document.getElementById('openRequestBtn');

    function togglePanel(open) {
      const isOpen = open !== undefined ? open : panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !isOpen);
      panel.setAttribute('aria-hidden', String(!isOpen));
      fab.setAttribute('aria-expanded', String(isOpen));
      iconMsg.classList.toggle('hidden', isOpen);
      iconClose.classList.toggle('hidden', !isOpen);
    }

    fab.addEventListener('click', () => togglePanel());
    openBtn.addEventListener('click', () => { togglePanel(true); fab.scrollIntoView({ behavior: 'smooth', block: 'end' }); });

    document.addEventListener('click', (e) => {
      if (!document.getElementById('requestFabWrap').contains(e.target)) togglePanel(false);
    });

    // 패널 초기 hidden
    panel.classList.add('hidden');

    /* ── 로그인 폼 ── */
    const form    = document.getElementById('loginForm');
    const input   = document.getElementById('codeInput');
    const btn     = document.getElementById('loginBtn');
    const spinner = document.getElementById('loginBtnSpinner');
    const btnText = document.getElementById('loginBtnText');
    const errMsg  = document.getElementById('loginError');

    // 입력값 자동 대문자 변환
    input.addEventListener('input', () => {
      const pos = input.selectionStart;
      input.value = input.value.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
      input.setSelectionRange(pos, pos);
      errMsg.classList.add('hidden');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = input.value.trim();
      if (!code) { input.focus(); return; }

      btn.disabled = true;
      btnText.classList.add('hidden');
      spinner.classList.remove('hidden');
      errMsg.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          errMsg.classList.remove('hidden');
          input.select();
        }
      } catch {
        errMsg.textContent = '네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
        errMsg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
