<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>로그인 — StockPulse</title>
  <meta name="theme-color" content="#080c14" />
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Google tag (gtag.js) — M-3: GA-ID를 실제 측정 ID로 교체하세요 (예: G-ABCD123456) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KMCM3VCKN6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-KMCM3VCKN6');
  </script>
  <script>
    (function () {
      var t = localStorage.getItem('sp_theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
    // 이미 로그인 상태면 대시보드로 리다이렉트
    (async function () {
      try {
        var r = await fetch('/api/auth/me', { credentials: 'same-origin' });
        if (r.ok) {
          var d = await r.json();
          if (d.loggedIn) window.location.replace('/');
        }
      } catch (_) { /* 네트워크 오류 무시 — 로그인 폼 표시 */ }
    })();
  </script>
</head>
<body class="login-page">

  <!-- ── 로그인 카드 ── -->
  <main class="login-main">
    <div class="login-card">

      <!-- 로고 -->
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <polyline points="22,7 13.5,15.5 8.5,10.5 2,17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="16,7 22,7 22,13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="login-logo-text">StockPulse</span>
      </div>

      <!-- 제목 -->
      <div class="login-header">
        <h1 class="login-title">1회용 코드로 로그인</h1>
        <p class="login-subtitle">관리자로부터 받은 코드를 입력하세요</p>
      </div>

      <!-- 폼 -->
      <form class="login-form" id="loginForm" autocomplete="off">
        <div class="login-input-wrap">
          <input
            id="codeInput"
            type="text"
            class="login-code-input"
            placeholder="XXXXXXXX"
            maxlength="16"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="characters"
            aria-label="1회용 로그인 코드"
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span id="loginBtnText">로그인</span>
          <svg id="loginBtnSpinner" class="login-spinner hidden" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.5" stroke-dasharray="32" stroke-dashoffset="12" stroke-linecap="round"/>
          </svg>
        </button>

        <p id="loginError" class="login-error hidden">코드가 올바르지 않습니다. 다시 확인해주세요.</p>
      </form>

      <!-- 안내 -->
      <p class="login-hint">
        코드가 없으신가요?
        <button type="button" class="login-hint-link" id="openRequestBtn">아래 버튼으로 요청</button>하세요.
      </p>

    </div>
  </main>

  <!-- ── 코드 요청 FAB (우측 하단) ── -->
  <div class="request-fab-wrap" id="requestFabWrap">

    <!-- 팝업 패널 -->
    <div class="request-panel" id="requestPanel" aria-hidden="true">
      <p class="request-panel-title">접속 코드 요청</p>

      <!-- 기본 폼 뷰 -->
      <div id="reqFormView">
        <p class="request-panel-desc">이메일을 입력하고 수신 방법을 선택하세요.</p>
        <input
          id="reqEmail"
          type="email"
          class="req-email-input"
          placeholder="your@email.com"
          autocomplete="email"
          spellcheck="false"
        />
        <div class="req-delivery-btns">
          <button type="button" class="req-delivery-btn" data-delivery="email">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
              <polyline points="2,4 12,13 22,4" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            이메일로 받기
          </button>
          <button type="button" class="req-delivery-btn" data-delivery="instant">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <polygon points="13,2 3,14 12,14 11,22 21,10 12,10" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/>
            </svg>
            즉시 받기
          </button>
        </div>
        <p id="reqError" class="req-error hidden"></p>
      </div>

      <!-- 이메일 전송 완료 뷰 -->
      <div id="reqEmailDoneView" class="hidden">
        <p class="req-done-msg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:6px;">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <polyline points="8,12 11,15 16,9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          요청이 전달됐습니다.<br/>이메일을 확인해주세요.
        </p>
        <button type="button" class="req-cancel-btn" id="reqEmailResetBtn">다시 요청</button>
      </div>

      <!-- 즉시 수신 대기 뷰 -->
      <div id="reqWaitView" class="hidden">
        <p class="req-wait-msg">관리자가 확인 중입니다…</p>
        <p id="reqCountdown" class="req-countdown">30:00</p>
        <button type="button" class="req-cancel-btn" id="reqCancelBtn">취소</button>
      </div>
    </div>

    <!-- FAB 버튼 -->
    <button type="button" class="request-fab" id="requestFab" aria-label="코드 요청" aria-expanded="false">
      <svg class="fab-icon-msg" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="fab-icon-close hidden" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>

  </div>

  <script>
    /* ── FAB 토글 ── */
    const fab       = document.getElementById('requestFab');
    const panel     = document.getElementById('requestPanel');
    const iconMsg   = fab.querySelector('.fab-icon-msg');
    const iconClose = fab.querySelector('.fab-icon-close');
    const openBtn   = document.getElementById('openRequestBtn');

    function togglePanel(open) {
      const isOpen = open !== undefined ? open : panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !isOpen);
      panel.setAttribute('aria-hidden', String(!isOpen));
      fab.setAttribute('aria-expanded', String(isOpen));
      iconMsg.classList.toggle('hidden', isOpen);
      iconClose.classList.toggle('hidden', !isOpen);
    }

    fab.addEventListener('click', () => togglePanel());
    openBtn.addEventListener('click', () => { togglePanel(true); fab.scrollIntoView({ behavior: 'smooth', block: 'end' }); });

    document.addEventListener('click', (e) => {
      if (!document.getElementById('requestFabWrap').contains(e.target)) togglePanel(false);
    });

    // 패널 초기 hidden
    panel.classList.add('hidden');

    /* ── 코드 요청 폼 ── */
    function switchReqView(view) {
      document.getElementById('reqFormView').classList.toggle('hidden', view !== 'form');
      document.getElementById('reqEmailDoneView').classList.toggle('hidden', view !== 'emailDone');
      document.getElementById('reqWaitView').classList.toggle('hidden', view !== 'wait');
    }

    function showReqError(msg) {
      const el = document.getElementById('reqError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // 전달 방식 버튼
    document.querySelectorAll('.req-delivery-btn').forEach((btn) => {
      btn.addEventListener('click', () => submitRequest(btn.dataset.delivery));
    });

    // 이메일 입력창 엔터키
    document.getElementById('reqEmail').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitRequest('email');
    });

    async function submitRequest(delivery) {
      const emailEl = document.getElementById('reqEmail');
      const email = emailEl.value.trim();
      if (!email || !email.includes('@')) {
        showReqError('올바른 이메일을 입력해주세요.');
        emailEl.focus();
        return;
      }
      document.getElementById('reqError').classList.add('hidden');

      // 버튼 비활성화
      document.querySelectorAll('.req-delivery-btn').forEach(b => b.disabled = true);

      try {
        const res = await fetch('/api/access-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, delivery }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'request_failed');

        if (delivery === 'email') {
          switchReqView('emailDone');
        } else {
          switchReqView('wait');
          startPolling(data.token);
        }
      } catch (err) {
        showReqError('요청 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
        document.querySelectorAll('.req-delivery-btn').forEach(b => b.disabled = false);
      }
    }

    // 다시 요청 버튼
    document.getElementById('reqEmailResetBtn').addEventListener('click', () => {
      document.getElementById('reqEmail').value = '';
      document.getElementById('reqError').classList.add('hidden');
      document.querySelectorAll('.req-delivery-btn').forEach(b => b.disabled = false);
      switchReqView('form');
    });

    // 취소 버튼
    document.getElementById('reqCancelBtn').addEventListener('click', () => {
      stopPolling();
      document.getElementById('reqEmail').value = '';
      document.querySelectorAll('.req-delivery-btn').forEach(b => b.disabled = false);
      switchReqView('form');
    });

    /* ── 폴링 ── */
    let _pollTimer = null;
    let _pollExpiry = null;
    let _countdownTimer = null;

    function startPolling(token) {
      _pollExpiry = Date.now() + 30 * 60 * 1000;
      updateCountdown();
      _countdownTimer = setInterval(updateCountdown, 1000);
      _pollTimer = setInterval(async () => {
        if (Date.now() > _pollExpiry) { stopPolling(); switchReqView('form'); showReqError('요청이 만료됐습니다. 다시 시도해주세요.'); return; }
        try {
          const res = await fetch(`/api/access-requests/${token}/status`);
          const data = await res.json();
          if (data.status === 'approved') {
            stopPolling();
            document.getElementById('codeInput').value = data.code;
            togglePanel(false);
            // 코드 도착 안내 (간단 인라인 메시지)
            const errEl = document.getElementById('loginError');
            errEl.textContent = '코드가 자동 입력됐습니다. 로그인 버튼을 눌러주세요.';
            errEl.style.color = 'var(--accent)';
            errEl.classList.remove('hidden');
            document.getElementById('codeInput').focus();
          } else if (data.status === 'expired') {
            stopPolling();
            switchReqView('form');
            showReqError('요청이 만료됐습니다. 다시 시도해주세요.');
          }
        } catch { /* 네트워크 오류 무시 */ }
      }, 5000);
    }

    function stopPolling() {
      clearInterval(_pollTimer);
      clearInterval(_countdownTimer);
      _pollTimer = null;
    }

    function updateCountdown() {
      const remaining = Math.max(0, _pollExpiry - Date.now());
      const m = String(Math.floor(remaining / 60000)).padStart(2, '0');
      const s = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
      const el = document.getElementById('reqCountdown');
      if (el) el.textContent = `${m}:${s}`;
    }

    /* ── 로그인 폼 ── */
    const form    = document.getElementById('loginForm');
    const input   = document.getElementById('codeInput');
    const btn     = document.getElementById('loginBtn');
    const spinner = document.getElementById('loginBtnSpinner');
    const btnText = document.getElementById('loginBtnText');
    const errMsg  = document.getElementById('loginError');

    // 입력값 자동 대문자 변환
    input.addEventListener('input', () => {
      const pos = input.selectionStart;
      input.value = input.value.toUpperCase().replace(/[^A-Z0-9\-]/g, '');
      input.setSelectionRange(pos, pos);
      errMsg.classList.add('hidden');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = input.value.trim();
      if (!code) { input.focus(); return; }

      btn.disabled = true;
      btnText.classList.add('hidden');
      spinner.classList.remove('hidden');
      errMsg.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          errMsg.classList.remove('hidden');
          input.select();
        }
      } catch {
        errMsg.textContent = '네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
        errMsg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btnText.classList.remove('hidden');
        spinner.classList.add('hidden');
      }
    });
  </script>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="site-footer-inner">
      <p class="footer-notice">본 서비스는 투자 조언을 제공하지 않으며, 모든 데이터는 참고용입니다.</p>
      <nav class="footer-links" aria-label="법적 고지">
        <a href="/disclaimer.html" class="footer-link">면책고지</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="/privacy.html" class="footer-link">개인정보처리방침</a>
      </nav>
      <p class="footer-copy">© 2026 StockPulse</p>
    </div>
  </footer>
</body>
</html>
